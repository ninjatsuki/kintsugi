[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kintsugi"
version = "0.1.0"
description = "Lagrange interpolation in Python with SymPy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ninjatsuki" }]
dependencies = [
  "sympy>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
kintsugi = "kintsugi.cli:main"

[tool.setuptools]
packages = ["kintsugi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
