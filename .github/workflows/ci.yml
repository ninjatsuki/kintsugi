import pytest
from sympy import symbols

from kintsugi import lagrange_interpolation


def test_lagrange_interpolation_for_quadratic_points():
    points = [(0, 1), (1, 3), (2, 9)]
    polynomial = lagrange_interpolation(points)

    x = symbols("x")
    assert polynomial.expand() == x**2 + x + 1


def test_lagrange_interpolation_for_linear_points():
    points = [(0, 2), (2, 6)]
    polynomial = lagrange_interpolation(points)

    x = symbols("x")
    assert polynomial.expand() == 2 * x + 2


def test_duplicate_x_values_are_rejected():
    with pytest.raises(ValueError, match="Duplicate x values"):
        lagrange_interpolation([(0, 1), (0, 2), (2, 5)])


def test_empty_input_is_rejected():
    with pytest.raises(ValueError, match="At least one point"):
        lagrange_interpolation([])


def test_cli_uses_default_points(capsys):
    from kintsugi.cli import main

    exit_code = main([])

    captured = capsys.readouterr()
    assert exit_code == 0
    assert "x" in captured.out
